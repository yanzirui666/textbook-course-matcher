[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "textbook-course-matcher"
version = "0.1.0"
description = "Match a Chinese textbook outline to Bilibili lessons."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28,<1",
    "pypdf>=6,<8",
    "streamlit>=1.55,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["course_matcher*"]

[tool.setuptools.package-data]
course_matcher = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
